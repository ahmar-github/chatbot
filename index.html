<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin System Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Modern Tech Dark Blue Theme */
        :root {
            --bg-deep: #050B14;
            --bg-panel: #0A1628;
            --bg-chat: #0F203B;
            --primary-blue: #0078FF;
            --cyan-glow: #00E5FF;
            --text-main: #E2E8F0;
            --text-muted: #8B9BB4;
            --border-color: #1A2E4C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 120, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.05), transparent 25%);
        }

        .hidden { display: none !important; }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            background: var(--bg-panel);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 120, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        #login-screen h2 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 1px;
        }

        #login-screen p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* --- CHAT SCREEN --- */
        #chat-screen {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            padding: 20px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        .chat-container {
            flex: 2;
        }

        .db-container {
            flex: 1;
            background: #03070E;
        }

        .panel-header {
            padding: 15px 20px;
            background: rgba(15, 32, 59, 0.8);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        /* --- CHAT BOX --- */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-msg {
            background: var(--primary-blue);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(0, 120, 255, 0.3);
        }

        .bot-msg {
            background: var(--bg-chat);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* --- INPUTS & BUTTONS --- */
        .input-area {
            padding: 15px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(0, 120, 255, 0.2);
        }

        button {
            padding: 14px 24px;
            background: var(--primary-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            background: #0061D5;
            box-shadow: 0 0 15px rgba(0, 120, 255, 0.4);
        }

        #login-error {
            color: #FF4757;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        /* --- DATABASE VIEW --- */
        pre {
            font-family: 'Fira Code', monospace;
            color: var(--cyan-glow);
            padding: 20px;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h2>System Access</h2>
        <p>Authenticate with <b>admin@system.com</b></p>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" id="email-input" placeholder="Admin Email Address">
            <button onclick="login()">Initialize Session</button>
        </div>
        <p id="login-error"></p>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="hidden">
        
        <!-- Chat Interface -->
        <div class="panel chat-container">
            <div class="panel-header">Admin NLP Terminal</div>
            <div class="chat-box" id="chat-box">
                <div class="message bot-msg">System initialized. Awaiting database commands (Add, Update, Remove).</div>
            </div>
            <div class="input-area">
                <input type="text" id="chat-input" placeholder="e.g. Add user john.smith@xyz.com with phone +92332..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Execute</button>
            </div>
        </div>

        <!-- Live Database State -->
        <div class="panel db-container">
            <div class="panel-header">Live DB State</div>
            <pre id="db-state">{
  // Awaiting transactions...
}</pre>
        </div>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Allow pressing "Enter" to send messages
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function login() {
            const email = document.getElementById("email-input").value;
            const errorText = document.getElementById("login-error");
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (res.ok) {
                    document.getElementById("login-screen").classList.add("hidden");
                    document.getElementById("chat-screen").classList.remove("hidden");
                } else {
                    errorText.innerText = "Access Denied: Invalid credentials.";
                }
            } catch (err) {
                errorText.innerText = "Connection Error: Is the backend running?";
            }
        }

        async function sendMessage() {
    const input = document.getElementById("chat-input");
    const message = input.value;
    if (!message.trim()) return;

    addMessageToUI("user-msg", message);
    input.value = "";

    try {
        const res = await fetch(`${API_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        
        if (res.ok) {
            addMessageToUI("bot-msg", data.reply);
            document.getElementById("db-state").innerText = JSON.stringify(data.db_state, null, 2);
        } else {
            // Display actual server error details
            addMessageToUI("bot-msg", `[Server Error]: ${data.detail || "Transaction failed"}`);
        }
    } catch (err) {
        addMessageToUI("bot-msg", "System Error: Unable to connect to backend server.");
    }
}

        function addMessageToUI(className, text) {
            const box = document.getElementById("chat-box");
            box.innerHTML += `<div class="message ${className}">${text}</div>`;
            box.scrollTop = box.scrollHeight; // Auto-scroll to bottom
        }
    </script>
</body>
</html>
